name: Keep BSBE production API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping BSBE API
        run: |
          curl --silent --show-error --location             --retry 3 --retry-all-errors --retry-delay 10 --max-time 90             --output /dev/null             https://bsbe-placement-api.onrender.com/
