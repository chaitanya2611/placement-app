name: Keep production backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend health endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 10 --max-time 90 \
            https://prep-to-place.onrender.com/api/health
